
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projeto_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
    command: >
      sh -c "touch database/database.sqlite &&
      (grep -q '^APP_KEY=base64:' .env ||
      php artisan key:generate --force) &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projeto_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
